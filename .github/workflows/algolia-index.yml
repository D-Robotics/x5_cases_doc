name: Update Algolia DocSearch index

on:
  workflow_run:
    workflows: ["Sync gh-pages to OSS"]
    types:
      - completed
  workflow_dispatch:

jobs:
  algolia-index:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clean install dependencies
        run: |
          rm -rf node_modules
          npm ci

      - name: Wait until published site is reachable
        run: |
          url="https://developer.d-robotics.cc/x5_cases_doc/sitemap.xml"
          for i in $(seq 1 12); do
            code=$(curl -sS -o /dev/null -w "%{http_code}" -L "$url" || true)
            echo "Attempt $i: $url -> $code"
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 15
          done
          echo "Published site is not reachable. Skip until https://developer.d-robotics.cc/x5_cases_doc/ is live."
          exit 1

      - name: Crawl published site and update Algolia index
        env:
          ALGOLIA_ADMIN_API_KEY: ${{ secrets.ALGOLIA_ADMIN_API_KEY }}
          ALGOLIA_APP_ID: 1VU781LYTV
          ALGOLIA_INDEX_NAME: x5_cases_doc
          ALGOLIA_SITE_URL: https://developer.d-robotics.cc/x5_cases_doc/
        run: npm run algolia:index

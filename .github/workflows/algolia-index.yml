name: Update Algolia DocSearch index

on:
  workflow_run:
    workflows: ["Sync gh-pages to OSS"]
    types:
      - completed
  workflow_dispatch:

jobs:
  algolia-index:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clean install dependencies
        run: |
          rm -rf node_modules
          npm ci

      - name: Wait until published site is reachable
        run: |
          # 探针必须是真正文页：站根只是 meta-refresh 跳转壳，而 sitemap.xml
          # 因 nginx 未直通 .xml 恒 404，用 sitemap 当存活探针会误判站点未上线。
          url="https://developer.d-robotics.cc/x5_cases_doc/case"
          for i in $(seq 1 12); do
            code=$(curl -sS -o /dev/null -w "%{http_code}" -L "$url" || true)
            echo "Attempt $i: $url -> $code"
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 15
          done
          echo "Published site is not reachable. Skip until $url is live."
          exit 1

      - name: Crawl published site and update Algolia index
        env:
          ALGOLIA_ADMIN_API_KEY: ${{ secrets.ALGOLIA_ADMIN_API_KEY }}
          ALGOLIA_APP_ID: 1VU781LYTV
          ALGOLIA_INDEX_NAME: x5_cases_doc
          ALGOLIA_SITE_URL: https://developer.d-robotics.cc/x5_cases_doc/
        run: npm run algolia:index

      - name: Setup ossutil v2
        run: |
          if [ ! -x "$HOME/ossutil" ]; then
            curl -o ossutil.zip https://gosspublic.alicdn.com/ossutil/v2/2.1.2/ossutil-2.1.2-linux-amd64.zip
            unzip ossutil.zip
            cd ossutil-2.1.2-linux-amd64
            chmod 755 ossutil
            mv ossutil "$HOME/ossutil"
          fi

      # 覆盖式单文件上传：MCP 读取站点根目录的 search-index.json。
      # 不能带 -r / --update（那只会增不删）。
      - name: Upload search-index.json to OSS
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: |
          ~/ossutil cp -f scripts/_algolia_tmp/search-index.json \
            oss://cn-rdk-front-prod/x5_cases_doc/search-index.json \
            -e https://d-robotics.cc \
            -i $OSS_ACCESS_KEY_ID \
            -k $OSS_ACCESS_KEY_SECRET \
            --region cn-beijing \
            --retry-times=3
